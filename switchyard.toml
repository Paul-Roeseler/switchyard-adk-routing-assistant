schema_version = 1

[llm_clients.nvidia]
format = "openai_chat"
base_url = "https://inference-api.nvidia.com/v1"
api_key_env = "INFERENCE_HUB_API"
max_retries = 0

[llm_clients.nebius]
format = "openai_chat"
base_url = "https://api.tokenfactory.us-central1.nebius.com/v1/"
api_key_env = "NEBIUS_API_KEY"
max_retries = 0

[llm_clients.vertex]
format = "openai_chat"
base_url = "https://aiplatform.googleapis.com/v1/projects/model-routing-505414/locations/global/endpoints/openapi"
api_key_env = "VERTEX_ACCESS_TOKEN"
max_retries = 0

[targets.simple]
id = "nvidia/qwen/qwen3.8-27b"
llm_client = "nvidia"

[targets.classifier]
id = "nvidia/nvidia/nemotron-3.5-lightning"
llm_client = "nvidia"
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[targets.medium]
id = "zai-org/GLM-5.3-Flash"
llm_client = "nebius"

[targets.complex]
id = "google/gemini-3.8-flash"
llm_client = "vertex"
extra_body = { reasoning_effort = "medium" }

[targets.reasoning]
id = "google/gemini-3.1-pro-preview-customtools"
llm_client = "vertex"
extra_body = { reasoning_effort = "high" }

[routes.employee_it]
id = "employee-it"
type = "llm_classifier"
mode = "custom"
classifier_target = "classifier"
targets = ["reasoning", "complex", "medium", "simple"]
default_target = "reasoning"
session_affinity = true
message_hash_fallback = true
prompt = """
Choose the least-capable target that can reliably complete the whole
employee-IT request.

- simple: A direct answer or one straightforward policy lookup.
- medium: Routine synthesis across policy and employee or device data.
- complex: A dependent multi-tool workflow, ticket check, or request draft.
- reasoning: Ambiguous or conflicting policy, exceptions, high risk, or deep analysis.

Judge the work required by the request, not every tool the agent could use.
When uncertain, choose reasoning. Return only JSON matching the response schema.
"""
response_schema = '''
{
  "type": "object",
  "properties": {
    "decision": {
      "type": "object",
      "properties": {
        "target": {
          "type": "string",
          "enum": ["simple", "medium", "complex", "reasoning"]
        }
      },
      "required": ["target"],
      "additionalProperties": false
    }
  },
  "required": ["decision"],
  "additionalProperties": false
}
'''

[routes.employee_it.policy]
type = "target_selector"
selector = "/decision/target"
