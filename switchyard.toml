schema_version = 1

[llm_clients.nebius]
format = "openai_chat"
base_url = "https://api.tokenfactory.nebius.com/v1/"
api_key_env = "NEBIUS_API_KEY"
max_retries = 0

[llm_clients.vertex]
format = "openai_chat"
base_url = "https://aiplatform.googleapis.com/v1/projects/model-routing-505414/locations/global/endpoints/openapi"
api_key_env = "VERTEX_ACCESS_TOKEN"
max_retries = 0

[targets.classifier]
id = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B"
llm_client = "nebius"

[targets.simple]
id = "Qwen/Qwen3-30B-A3B-Instruct-2507"
llm_client = "nebius"

[targets.medium]
id = "zai-org/GLM-5.3-Flash"
llm_client = "nebius"
extra_body = { reasoning_effort = "low" }

[targets.complex]
id = "google/gemini-3.8-flash"
llm_client = "vertex"
extra_body = { reasoning_effort = "medium" }

[targets.reasoning]
id = "google/gemini-3.1-pro-preview-customtools"
llm_client = "vertex"
extra_body = { reasoning_effort = "high" }

[routes.employee_it]
id = "employee-it"
type = "llm_classifier"
mode = "custom"
classifier_target = "classifier"
targets = ["reasoning", "complex", "medium", "simple"]
default_target = "complex"
session_affinity = true
message_hash_fallback = true
prompt = """
Choose the least-capable target that can reliably complete the employee's
whole request. Infer the operational work implied by the situation; employees
do not need to explicitly ask for every lookup, ticket check, or draft step.

- simple: General capabilities, greetings, or a direct policy answer that needs
  no employee, device, or ticket context and causes no action.
- medium: One employee or device lookup followed by routine explanation or
  synthesis, with no incident/request workflow.
- complex: An operational incident or service-request workflow involving
  multiple dependent steps, such as identifying the device, checking existing
  tickets, determining request type or priority, and drafting a request. A
  broken or unusable device with stated business impact belongs here even when
  the employee only asks for help.
- reasoning: A genuinely ambiguous, conflicting, exceptional, or high-risk
  policy decision that requires resolving competing instructions. Do not use
  this tier merely because an ordinary operational workflow has several steps.

Required examples:
- "With what tasks can you help me?" -> simple
- "How old is my laptop, and is it old enough for a planned replacement?" -> medium
- "My laptop will not turn on, and I have a customer presentation tomorrow
  morning. Can you help?" -> complex
- A request to falsely classify a working laptop as a P1 incident -> reasoning

Judge the complete work the agent must perform, not just the literal wording of
the last sentence. When an incident/request workflow is clearly implied, choose
complex. Return only JSON matching the response schema.
"""
response_schema = '''
{
  "type": "object",
  "additionalProperties": false,
  "required": ["target"],
  "properties": {
    "target": {
      "type": "string",
      "enum": ["simple", "medium", "complex", "reasoning"]
    }
  }
}
'''

[routes.employee_it.policy]
type = "target_selector"
selector = "/target"
